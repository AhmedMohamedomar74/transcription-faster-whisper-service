version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - uploads:/tmp/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - mongo
    mem_limit: 2g

  worker:
    build: .
    command: celery -A worker worker --concurrency=1 --prefetch-multiplier=1 --loglevel=info
    env_file: .env
    environment:
      - OMP_NUM_THREADS=2
    volumes:
      - uploads:/tmp/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - mongo
    mem_limit: 2g
    deploy:
      replicas: 2

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    mem_limit: 512m

volumes:
  uploads:
  model_cache:
  redis_data:
  mongo_data:
