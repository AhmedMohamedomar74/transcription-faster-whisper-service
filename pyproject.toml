[project]
name = "whisper-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.29,<1",
    "celery[redis]>=5.4,<6",
    "python-multipart>=0.0.31,<1",
    "pydantic-settings>=2.14.2,<3",
    "faster-whisper>=1.0,<2",
    "pymongo>=4.6,<5",
    "boto3>=1.34,<2",
    "sse-starlette>=1.6,<3",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pip-audit",
]

[tool.black]
line-length = 90
target-version = ["py311"]

[tool.isort]
profile = "black"
