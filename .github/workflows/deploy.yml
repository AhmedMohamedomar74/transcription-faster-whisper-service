name: Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Encode .env for safe transfer
        id: encode
        env:
          RAW_ENV: ${{ secrets.APP_ENV_FILE }}
        run: |
          ENV_B64=$(printf '%s' "$RAW_ENV" | base64 -w 0)
          echo "env_b64=${ENV_B64}" >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_B64: ${{ steps.encode.outputs.env_b64 }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_B64,IMAGE_TAG,GH_TOKEN,DEPLOY_PATH,REPO,ACTOR
          script: |
            IMAGE_NAME=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            cd "$DEPLOY_PATH"

            # Ensure shared network exists
            docker network create shared 2>/dev/null || true

            # Snapshot current image for rollback
            CONTAINER_ID=$(docker compose -f docker-compose.prod.yml ps -q whisper-api 2>/dev/null | head -1)
            PREV_IMAGE=""
            if [ -n "$CONTAINER_ID" ]; then
              PREV_IMAGE=$(docker inspect --format='{{.Image}}' "$CONTAINER_ID" 2>/dev/null)
              echo "Snapshotted: $PREV_IMAGE"
            else
              echo "No running container — first deployment"
            fi

            # Decode .env safely
            echo "$ENV_B64" | base64 -d > .env
            # Ensure trailing newline before appending
            sed -i -e '$a\' .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            echo "REGISTRY=ghcr.io" >> .env
            echo "IMAGE_NAME=${IMAGE_NAME}" >> .env

            # Pull and deploy
            docker compose -f docker-compose.prod.yml pull whisper-api whisper-worker
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-build

            # Health check
            sleep 15
            for i in $(seq 1 30); do
              HTTP_CODE=$(docker compose -f docker-compose.prod.yml exec -T whisper-api curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              echo "Attempt $i/30 (HTTP $HTTP_CODE) — waiting 10s..."
              sleep 10
            done

            # Rollback
            echo "Health check failed — rolling back..."
            if [ -n "$PREV_IMAGE" ]; then
              docker tag "$PREV_IMAGE" ghcr.io/${IMAGE_NAME}:latest
              docker compose -f docker-compose.prod.yml --env-file .env up -d --no-build whisper-api whisper-worker
              echo "Rolled back to $PREV_IMAGE"
            else
              echo "No previous image — cannot rollback"
            fi
            exit 1
